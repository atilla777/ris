name: Package installation CLI
on:
  push:
    paths:
      - 'skills/ris-port-op-manage-installation/scripts/**'
      - 'tests/package_installation/**'
      - '.github/workflows/package-installation.yml'
  pull_request:
    paths:
      - 'skills/ris-port-op-manage-installation/scripts/**'
      - 'tests/package_installation/**'
      - '.github/workflows/package-installation.yml'
permissions:
  contents: read
jobs:
  filesystem-cli:
    name: CLI (${{ matrix.os }}, /bin/bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RIS_TEST_BASH: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: External macOS dependency setup
        if: runner.os == 'macOS'
        run: |
          brew install flock
          case "$(brew list --versions flock)" in
            'flock 0.4.0'|'flock 0.4.0_'*) ;;
            *) exit 1 ;;
          esac
      - name: Revision and platform evidence
        run: |
          git rev-parse HEAD
          uname -a
          /bin/bash --version
          git --version
          python3 --version
          if [ "$RUNNER_OS" = macOS ]; then
            brew list --versions flock
            test "$(/bin/bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')" = 3.2
          else
            flock --version
          fi
      - name: G0 lock and portable copy feasibility
        run: python3 -m unittest discover -s tests/package_installation -p 'test_*.py' -v -k g0
      - name: Bash syntax and complete deterministic CLI suite
        run: |
          /bin/bash -n skills/ris-port-op-manage-installation/scripts/ris-install.sh
          python3 -m unittest discover -s tests/package_installation -p 'test_*.py' -v
