name: Production package installation
on:
  push:
    paths:
      - 'skills/**'
      - 'commands/opencode/**'
      - '.opencode/skills/**'
      - '.opencode/command/**'
      - 'tests/package_installation/**'
      - 'tests/package_installation_integration/**'
      - '.github/workflows/package-installation-integration.yml'
      - 'README.md'
      - 'docs/rules/architecture/**'
      - 'docs/skill-command-naming-migration.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'commands/opencode/**'
      - '.opencode/skills/**'
      - '.opencode/command/**'
      - 'tests/package_installation/**'
      - 'tests/package_installation_integration/**'
      - '.github/workflows/package-installation-integration.yml'
      - 'README.md'
      - 'docs/rules/architecture/**'
      - 'docs/skill-command-naming-migration.md'
permissions:
  contents: read
jobs:
  production-package:
    name: Production package (${{ matrix.os }}, /bin/bash)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RIS_TEST_BASH: /bin/bash
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: External macOS dependency setup
        if: runner.os == 'macOS'
        run: |
          brew install flock
          case "$(brew list --versions flock)" in
            'flock 0.4.0'|'flock 0.4.0_'*) ;;
            *) exit 1 ;;
          esac
      - name: Exact revision and platform evidence
        run: |
          git rev-parse HEAD HEAD^{tree}
          uname -a
          /bin/bash --version
          git --version
          python3 --version
          if [ "$RUNNER_OS" = macOS ]; then
            brew list --versions flock
            test "$(/bin/bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')" = 3.2
          else
            flock --version
          fi
      - name: Production lifecycle, recovery and checked bootstrap
        run: |
          /bin/bash -n skills/ris-port-op-manage-installation/scripts/ris-install.sh
          python3 -m unittest discover -s tests/package_installation_integration -p 'test_*.py' -v
